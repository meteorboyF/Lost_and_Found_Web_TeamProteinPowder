spring.application.name=lostfound

# --- Database -------------------------------------------------------------
# File-backed H2 so data survives a restart. No external database to install,
# which keeps the project runnable by any team member with just a JDK.
# AUTO_SERVER lets a second process (the H2 console, a DB viewer) attach to the
# same file while the app is running. H2 2.4 rejects it alongside
# DB_CLOSE_ON_EXIT, so that flag is deliberately absent.
spring.datasource.url=jdbc:h2:file:./db/lostfound;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Browse the data at http://localhost:8080/h2-console (JDBC URL above).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Web ------------------------------------------------------------------
server.port=8080
server.error.include-message=always

# Uploaded photographs are written here and served from /uploads/**.
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# --- Static assets --------------------------------------------------------
# Serve straight from the source tree first, falling back to the classpath.
# In development this makes an edited page or rebuilt stylesheet appear on
# refresh with no restart; in a jar the directory does not exist, so the
# classpath copy inside the jar is served instead. Caching stays off so the
# fallthrough never pins a stale copy.
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0

# --- Moderation -----------------------------------------------------------
# Shared key for the admin workspace, sent as X-Admin-Key. A coursework
# stopgap, not real authorisation: override it for any real deployment with
# APP_ADMIN_KEY as an environment variable.
app.admin.key=${APP_ADMIN_KEY:campus-admin-2026}

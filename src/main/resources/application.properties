spring.application.name=lostfound

# --- Database -------------------------------------------------------------
# MySQL is the application database. Every setting is env-overridable so the
# same build runs against the dockerised dev instance (./run.sh starts one on
# port 3307), the compose stack, or a native server:
#
#   DB_URL       e.g. jdbc:mysql://localhost:3306/lostfound
#   DB_USERNAME  defaults to lostfound
#   DB_PASSWORD  defaults to lostfound (dev only — override anywhere real)
#
# createDatabaseIfNotExist spares a manual CREATE DATABASE on first boot;
# allowPublicKeyRetrieval+useSSL=false suit a local caching_sha2 server over
# a non-TLS connection, which is what dev and compose are.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/lostfound?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:lostfound}
spring.datasource.password=${DB_PASSWORD:lostfound}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Web ------------------------------------------------------------------
server.port=8080
server.error.include-message=always

# Uploaded photographs are written here and served from /uploads/**.
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# --- Static assets --------------------------------------------------------
# Serve straight from the source tree first, falling back to the classpath.
# In development this makes an edited page or rebuilt stylesheet appear on
# refresh with no restart; in a jar the directory does not exist, so the
# classpath copy inside the jar is served instead. Caching stays off so the
# fallthrough never pins a stale copy.
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0

# --- Moderation -----------------------------------------------------------
# Shared key for the admin workspace, sent as X-Admin-Key. A coursework
# stopgap, not real authorisation: override it for any real deployment with
# APP_ADMIN_KEY as an environment variable.
app.admin.key=${APP_ADMIN_KEY:campus-admin-2026}

# --- Demo accounts ---------------------------------------------------------
# SeedLoader creates admin / student / pending_student on an empty database
# with fixed, published passwords. That is a coursework convenience and must
# not reach a real deployment: change those passwords, or drop the seeding,
# before this is exposed to anyone.

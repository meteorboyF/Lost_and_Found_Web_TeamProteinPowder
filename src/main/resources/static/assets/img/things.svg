<?xml version="1.0" encoding="UTF-8"?>
<!--
  things.svg — the floating objects in the landing hero.

  Hand-drawn, one symbol per object, all on a 120x120 grid. The "3D" reading
  comes from three layers per object: a base linear gradient (light source
  top-left), a darker underside shade, and a white specular highlight. Depth
  and motion are handled in CSS/JS by the hero stage, not in here.

  Referenced as <use href="/assets/img/things.svg#o-keys"> — gradients resolve
  inside this document, so their ids never collide with the page.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0"
     style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="g-sack" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="g-teal" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset=".5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="g-slate" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="g-violet" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="g-shine" cx=".3" cy=".25" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- =============== money bag =============== -->
  <symbol id="o-bag" viewBox="0 0 120 120">
    <!-- gathered neck -->
    <path d="M48 24 L72 24 L66 38 L54 38 Z" fill="url(#g-sack)"/>
    <!-- tie band -->
    <path d="M50 34 Q60 30 70 34 L72 42 Q60 37 48 42 Z" fill="#78350f"/>
    <!-- body -->
    <path d="M54 40 Q22 52 24 80 Q25 104 60 104 Q95 104 96 80 Q98 52 66 40 Z"
          fill="url(#g-sack)"/>
    <!-- underside shade -->
    <path d="M28 88 Q42 102 60 102 Q78 102 92 88 Q86 102 60 104 Q34 102 28 88 Z"
          fill="#78350f" opacity=".55"/>
    <!-- specular -->
    <ellipse cx="44" cy="60" rx="16" ry="22" fill="url(#g-shine)" transform="rotate(-18 44 60)"/>
    <!-- currency mark -->
    <text x="60" y="86" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="34" font-weight="800" fill="#fef3c7" stroke="#78350f"
          stroke-width="1.5" paint-order="stroke">$</text>
  </symbol>

  <!-- =============== keys =============== -->
  <symbol id="o-keys" viewBox="0 0 120 120">
    <g transform="rotate(-28 60 60)">
      <!-- head ring -->
      <circle cx="60" cy="34" r="18" fill="none" stroke="url(#g-gold)" stroke-width="11"/>
      <!-- shaft -->
      <rect x="54" y="48" width="12" height="46" rx="5" fill="url(#g-gold)"/>
      <!-- teeth -->
      <rect x="64" y="76" width="14" height="9" rx="3" fill="url(#g-gold)"/>
      <rect x="64" y="88" width="10" height="8" rx="3" fill="url(#g-gold)"/>
      <!-- shade on shaft's right edge -->
      <rect x="62" y="50" width="4" height="44" rx="2" fill="#92400e" opacity=".5"/>
      <!-- specular on ring -->
      <path d="M47 24 A18 18 0 0 1 66 18" fill="none" stroke="#fff" stroke-width="4"
            stroke-linecap="round" opacity=".7"/>
    </g>
    <!-- small second key behind -->
    <g transform="rotate(24 78 46)" opacity=".85">
      <circle cx="84" cy="38" r="11" fill="none" stroke="#d97706" stroke-width="7"/>
      <rect x="80" y="46" width="8" height="30" rx="4" fill="#d97706"/>
      <rect x="86" y="64" width="9" height="6" rx="3" fill="#d97706"/>
    </g>
  </symbol>

  <!-- =============== water bottle =============== -->
  <symbol id="o-bottle" viewBox="0 0 120 120">
    <!-- cap -->
    <rect x="48" y="12" width="24" height="12" rx="4" fill="#134e4a"/>
    <rect x="45" y="20" width="30" height="8" rx="4" fill="#0f766e"/>
    <!-- body -->
    <rect x="38" y="28" width="44" height="80" rx="18" fill="url(#g-teal)"/>
    <!-- label band -->
    <rect x="38" y="56" width="44" height="24" fill="#f0fdfa" opacity=".85"/>
    <path d="M46 64 h28 M46 71 h20" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <!-- underside shade -->
    <path d="M42 96 Q60 110 78 96 L78 100 Q60 112 42 100 Z" fill="#134e4a" opacity=".5"/>
    <!-- specular -->
    <rect x="44" y="32" width="9" height="66" rx="4.5" fill="#fff" opacity=".38"/>
  </symbol>

  <!-- =============== phone =============== -->
  <symbol id="o-phone" viewBox="0 0 120 120">
    <rect x="40" y="14" width="40" height="88" rx="10" fill="url(#g-slate)"/>
    <rect x="44" y="20" width="32" height="72" rx="5" fill="url(#g-screen)"/>
    <!-- screen glare -->
    <path d="M46 22 L64 22 L48 90 L46 84 Z" fill="#fff" opacity=".22"/>
    <!-- camera + speaker -->
    <circle cx="60" cy="98" r="3" fill="#94a3b8"/>
    <rect x="54" y="16" width="12" height="2.6" rx="1.3" fill="#94a3b8"/>
    <!-- a "found you" ping on screen -->
    <circle cx="60" cy="52" r="10" fill="none" stroke="#fff" stroke-width="2.5" opacity=".85"/>
    <circle cx="60" cy="52" r="3.5" fill="#fff"/>
  </symbol>

  <!-- =============== headphones =============== -->
  <symbol id="o-headphones" viewBox="0 0 120 120">
    <!-- band -->
    <path d="M28 72 V58 a32 32 0 0 1 64 0 v14" fill="none"
          stroke="url(#g-violet)" stroke-width="10" stroke-linecap="round"/>
    <!-- cups -->
    <rect x="20" y="66" width="18" height="30" rx="8" fill="url(#g-violet)"/>
    <rect x="82" y="66" width="18" height="30" rx="8" fill="url(#g-violet)"/>
    <!-- cup shading -->
    <rect x="31" y="68" width="6" height="26" rx="3" fill="#4c1d95" opacity=".55"/>
    <rect x="93" y="68" width="6" height="26" rx="3" fill="#4c1d95" opacity=".55"/>
    <!-- specular -->
    <path d="M36 40 a30 30 0 0 1 26 -9" fill="none" stroke="#fff" stroke-width="4"
          stroke-linecap="round" opacity=".65"/>
  </symbol>

  <!-- =============== student ID card =============== -->
  <symbol id="o-card" viewBox="0 0 120 120">
    <g transform="rotate(-8 60 60)">
      <rect x="22" y="38" width="76" height="48" rx="8" fill="url(#g-sky)"/>
      <!-- photo -->
      <rect x="30" y="48" width="22" height="28" rx="4" fill="#f0f9ff"/>
      <circle cx="41" cy="58" r="5" fill="#38bdf8"/>
      <path d="M33 74 a8 8 0 0 1 16 0 Z" fill="#38bdf8"/>
      <!-- text lines -->
      <path d="M58 52 h32 M58 61 h24 M58 70 h28" stroke="#f0f9ff" stroke-width="4"
            stroke-linecap="round"/>
      <!-- underside shade -->
      <path d="M22 78 h76 v0 a8 8 0 0 1 -8 8 H30 a8 8 0 0 1 -8 -8 Z" fill="#075985" opacity=".45"/>
      <!-- specular sweep -->
      <path d="M30 40 L52 40 L34 84 L26 84 Z" fill="#fff" opacity=".2"/>
    </g>
  </symbol>
</svg>

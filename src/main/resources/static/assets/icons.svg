    <path d="M12 3.2 5.5 6v5.6c0 4.1 2.7 7.1 6.5 8.2 3.8-1.1 6.5-4.1 6.5-8.2V6L12 3.2z"/>
    <path d="m9.2 11.8 2.1 2.1 3.9-4"/>
  </symbol>

  <!-- 6 Returned: an arrow into a hand -->

    <path d="M12 3v9M8.2 8.4 12 12.2l3.8-3.8"/>
    <path d="M4 14v4.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V14"/>
  </symbol>

  <!-- 7 Archived: a lidded box -->

<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg — hand-authored sprite sheet.

  Every glyph is drawn on a 24x24 grid with a 2px optical margin and is
  designed to be stroked, not filled: the consuming element sets
  fill:none; stroke:currentColor via the .icon utility class.

  Reference from markup as:
    <svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#i-search"></use></svg>

  Status glyphs (i-st-*) are shaped so the ten lifecycle states remain
  distinguishable in a monochrome, colour-blind, or forced-colours context.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- ==================== navigation & chrome ==================== -->

  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.4 15.4 20 20"/>
  </symbol>

  <symbol id="i-menu" viewBox="0 0 24 24">
    <path d="M3 6h18M3 12h18M3 18h18"/>
  </symbol>


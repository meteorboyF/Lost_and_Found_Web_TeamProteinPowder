  <!-- ==================== status glyphs ====================
       Each silhouette is deliberately unlike its neighbours so the ten
       lifecycle states survive greyscale, low vision, and forced colours. -->

  <!-- 1 Reported: an open ring, nothing confirmed -->
  <symbol id="i-st-reported" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="7.5" stroke-dasharray="3 3"/>
  </symbol>

  <!-- 2 In Storage: a shelved crate -->
  <symbol id="i-st-storage" viewBox="0 0 24 24">
    <rect x="4" y="7" width="16" height="11" rx="1"/>
    <path d="M4 11h16M12 7v4"/>
  </symbol>

  <!-- 3 Match Suggested: two nodes converging -->
  <symbol id="i-st-match" viewBox="0 0 24 24">
    <circle cx="6" cy="7" r="2.6"/>
    <circle cx="6" cy="17" r="2.6"/>
    <path d="M8.6 7.8 18 11.4M8.6 16.2 18 12.6"/>
    <circle cx="19.4" cy="12" r="1.6"/>
  </symbol>

  <!-- 4 Claim Pending: an hourglass -->
  <symbol id="i-st-pending" viewBox="0 0 24 24">
    <path d="M7 3.5h10M7 20.5h10"/>
    <path d="M8 3.5v3.2L12 12l4-5.3V3.5M8 20.5v-3.2L12 12l4 5.3v3.2"/>
  </symbol>

  <!-- 5 Verified: a check inside a shield -->

# Render blueprint — https://render.com/docs/blueprint-spec
#
# One-click deploy: New + > Blueprint > point at this repository. Free tier
# has no persistent disk, so the H2 database and uploads reset on each
# deploy; attach a paid disk mounted at /app for durable data.
services:
  - type: web
    name: lostfound
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ADMIN_KEY
        generateValue: true

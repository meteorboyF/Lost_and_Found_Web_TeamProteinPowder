# One-command local or server deployment:
#
#   docker compose up -d
#
# Data survives restarts through the two named volumes. Set a real moderation
# key in the environment before exposing this anywhere:
#
#   APP_ADMIN_KEY=something-secret docker compose up -d
services:
  app:
    build: .
    image: lostfound:local
    ports:
      - "8080:8080"
    environment:
      APP_ADMIN_KEY: ${APP_ADMIN_KEY:-campus-admin-2026}
    volumes:
      - lostfound-db:/app/db
      - lostfound-uploads:/app/uploads
    restart: unless-stopped

volumes:
  lostfound-db:
  lostfound-uploads:
